<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="680">
  <defs>
    <!-- Deep Cosmos Space Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="35%" stop-color="#070c20"/>
      <stop offset="70%" stop-color="#0b1536"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Nebulae Radial Gradients for rich atmosphere -->
    <radialGradient id="nebula1" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="78%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Glow Filters -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="superGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .constellation-line {
      stroke: rgba(147, 197, 253, 0.7);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .inter-link {
      stroke: rgba(147, 197, 253, 0.22);
      stroke-width: 1.2;
      stroke-dasharray: 4 5;
      fill: none;
    }
    .title-main {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 42px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 2px;
    }
  </style>

  <!-- Deep Space Canvas Base -->
  <rect width="100%" height="100%" fill="url(#skyGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#nebula1)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#nebula2)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#nebula3)" rx="16"/>

  <!-- Celestial Grid Lines -->
  <g opacity="0.12" stroke="#93c5fd" stroke-width="0.8">
    <line x1="0" y1="170" x2="1200" y2="170" stroke-dasharray="3 6"/>
    <line x1="0" y1="340" x2="1200" y2="340" stroke-dasharray="3 6"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke-dasharray="3 6"/>
    <line x1="300" y1="0" x2="300" y2="680" stroke-dasharray="3 6"/>
    <line x1="600" y1="0" x2="600" y2="680" stroke-dasharray="3 6"/>
    <line x1="900" y1="0" x2="900" y2="680" stroke-dasharray="3 6"/>
    <path d="M 0 600 Q 600 480 1200 600" fill="none" stroke-dasharray="4 8"/>
    <path d="M 0 190 Q 600 80 1200 190" fill="none" stroke-dasharray="4 8"/>
  </g>

  <!-- Ambient Stars to keep the sky rich -->
  <g fill="#ffffff">
    <circle cx="50" cy="40" r="0.9" opacity="0.5"/>
    <circle cx="140" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="330" cy="50" r="1.4" opacity="0.7"/>
    <circle cx="430" cy="190" r="1" opacity="0.5"/>
    <circle cx="530" cy="80" r="1.3" opacity="0.6"/>
    <circle cx="680" cy="50" r="1" opacity="0.5"/>
    <circle cx="770" cy="170" r="1.2" opacity="0.6"/>
    <circle cx="850" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="1140" cy="120" r="1.4" opacity="0.8"/>
    <circle cx="430" cy="480" r="1.3" opacity="0.5"/>
    <circle cx="770" cy="510" r="1.2" opacity="0.6"/>
    <circle cx="70" cy="630" r="1" opacity="0.5"/>
    <circle cx="360" cy="620" r="0.8" opacity="0.4"/>
    <circle cx="590" cy="640" r="1.2" opacity="0.6"/>
    <circle cx="830" cy="610" r="1" opacity="0.5"/>
    <circle cx="1160" cy="580" r="1.1" opacity="0.6"/>
  </g>

  <!-- ==================== CONNECTING INTER-CONSTELLATION MESH LINES ==================== -->
  <!-- Ursa Major to Cassiopeia -->
  <line x1="330" y1="120" x2="200" y2="305" class="inter-link"/>
  <!-- Cassiopeia to Scorpius -->
  <line x1="335" y1="315" x2="230" y2="490" class="inter-link"/>
  <!-- Ursa Major to Pegasus -->
  <line x1="330" y1="120" x2="900" y2="85" class="inter-link"/>
  <!-- Pegasus to Orion -->
  <line x1="1025" y1="175" x2="960" y2="290" class="inter-link"/>
  <!-- Orion to Aquarius -->
  <line x1="1075" y1="400" x2="920" y2="520" class="inter-link"/>
  <!-- Scorpius to Aquarius across bottom -->
  <line x1="280" y1="620" x2="920" y2="520" class="inter-link"/>

  <!-- ==================== 1. URSA MAJOR (Top Left) ==================== -->
  <g id="ursa-major">
    <polygon points="255,130 250,185 320,175 330,120" class="constellation-line"/>
    <polyline points="120,160 160,145 200,135 255,130" class="constellation-line"/>
    <circle cx="120" cy="160" r="3.2" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="160" cy="145" r="3.2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="200" cy="135" r="3.8" fill="#ffffff" filter="url(#superGlow)"/>
    <circle cx="255" cy="130" r="2.8" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="250" cy="185" r="3.4" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="320" cy="175" r="3.6" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="330" cy="120" r="4.2" fill="#fed7aa" filter="url(#superGlow)"/>
  </g>

  <!-- ==================== 2. CASSIOPEIA (Mid Left) ==================== -->
  <g id="cassiopeia">
    <polyline points="150,340 200,305 245,330 295,295 335,315" class="constellation-line"/>
    <circle cx="150" cy="340" r="3.2" fill="#fed7aa" filter="url(#starGlow)"/>
    <circle cx="200" cy="305" r="4.2" fill="#fdba74" filter="url(#superGlow)"/>
    <circle cx="245" cy="330" r="4.5" fill="#38bdf8" filter="url(#superGlow)"/>
    <circle cx="295" cy="295" r="3.3" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="335" cy="315" r="2.9" fill="#bae6fd" filter="url(#starGlow)"/>
  </g>

  <!-- ==================== 3. SCORPIUS (Bottom Left) ==================== -->
  <g id="scorpius">
    <!-- Claws: Graffias, Dschubba, Pi Scorpii -->
    <polyline points="140,460 175,490 145,520" class="constellation-line"/>
    <polyline points="140,460 200,475 145,520" class="constellation-line"/>
    <!-- Head to Antares to Body Curve -->
    <polyline points="175,490 230,490 260,520 280,560 270,600 240,625 210,615 200,580 230,570" class="constellation-line"/>
    <!-- Stinger Stars: Shaula & Lesath -->
    <circle cx="230" cy="570" r="4" fill="#38bdf8" filter="url(#superGlow)"/>
    <circle cx="200" cy="580" r="3.4" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="210" cy="615" r="3.2" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="240" cy="625" r="3.5" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="270" cy="600" r="3.2" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="280" cy="560" r="3.4" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="260" cy="520" r="3.5" fill="#bae6fd" filter="url(#starGlow)"/>
    <!-- Antares (Brilliant Red Supergiant) -->
    <circle cx="230" cy="490" r="5.5" fill="#ef4444" filter="url(#superGlow)"/>
    <circle cx="175" cy="490" r="3.8" fill="#38bdf8" filter="url(#superGlow)"/>
    <circle cx="140" cy="460" r="3.2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="145" cy="520" r="3.2" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="200" cy="475" r="3.4" fill="#e0f2fe" filter="url(#starGlow)"/>
  </g>

  <!-- ==================== 4. PEGASUS (Top Right) ==================== -->
  <g id="pegasus">
    <!-- Great Square -->
    <polygon points="900,85 1020,80 1025,175 905,180" class="constellation-line"/>
    <!-- Neck & Head extension -->
    <polyline points="900,85 860,115 825,100" class="constellation-line"/>
    <!-- Legs -->
    <polyline points="1020,80 1070,50" class="constellation-line"/>
    <polyline points="905,180 870,225" class="constellation-line"/>

    <circle cx="900" cy="85" r="3.8" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="1020" cy="80" r="4.2" fill="#ffffff" filter="url(#superGlow)"/>
    <circle cx="1025" cy="175" r="3.4" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="905" cy="180" r="4.2" fill="#fed7aa" filter="url(#superGlow)"/>
    <circle cx="860" cy="115" r="3" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="825" cy="100" r="3.2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="1070" cy="50" r="2.8" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="870" cy="225" r="3" fill="#fed7aa" filter="url(#starGlow)"/>
  </g>

  <!-- ==================== 5. ORION (Mid Right) ==================== -->
  <g id="orion">
    <!-- Shoulders & Belt -->
    <polyline points="960,290 1070,280 1045,345 1020,350 995,355 960,290" class="constellation-line"/>
    <!-- Belt to Rigel & Saiph -->
    <polyline points="995,355 950,415" class="constellation-line"/>
    <polyline points="1045,345 1075,400" class="constellation-line"/>
    <polyline points="1020,350 950,415" class="constellation-line"/>
    <polyline points="1020,350 1075,400" class="constellation-line"/>
    <!-- Bow / Shield -->
    <polyline points="1070,280 1115,300 1125,330 1120,360 1105,385" class="constellation-line"/>

    <!-- Betelgeuse (Red Supergiant) -->
    <circle cx="960" cy="290" r="5.2" fill="#fb923c" filter="url(#superGlow)"/>
    <!-- Bellatrix -->
    <circle cx="1070" cy="280" r="4" fill="#38bdf8" filter="url(#superGlow)"/>
    <!-- Belt Stars -->
    <circle cx="995" cy="355" r="3.4" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="1020" cy="350" r="3.6" fill="#ffffff" filter="url(#superGlow)"/>
    <circle cx="1045" cy="345" r="3.4" fill="#e0f2fe" filter="url(#starGlow)"/>
    <!-- Saiph -->
    <circle cx="950" cy="415" r="3.6" fill="#93c5fd" filter="url(#starGlow)"/>
    <!-- Rigel (Brilliant Blue Supergiant) -->
    <circle cx="1075" cy="400" r="5.5" fill="#e0f2fe" filter="url(#superGlow)"/>
    <!-- Bow stars -->
    <circle cx="1115" cy="300" r="2.4" fill="#bae6fd"/>
    <circle cx="1125" cy="330" r="2.6" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="1120" cy="360" r="2.4" fill="#bae6fd"/>
    <circle cx="1105" cy="385" r="2.4" fill="#bae6fd"/>
  </g>

  <!-- ==================== 6. AQUARIUS (Bottom Right) ==================== -->
  <g id="aquarius">
    <!-- Water Jar Asterism (Sadalsuud, Sadalmelik) to Stream of Water Waves -->
    <polyline points="870,490 920,520 960,505 1015,525 1055,495 1090,520" class="constellation-line"/>
    <polyline points="920,520 910,575 955,565 990,595 1040,580 1080,610" class="constellation-line"/>
    <polyline points="910,575 880,620 920,640 965,630 1005,650" class="constellation-line"/>
    
    <!-- Sadalmelik (Alpha Aqr) & Sadalsuud (Beta Aqr) -->
    <circle cx="920" cy="520" r="4.2" fill="#fde047" filter="url(#superGlow)"/>
    <circle cx="870" cy="490" r="4.2" fill="#fde047" filter="url(#superGlow)"/>
    <circle cx="960" cy="505" r="3.4" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="1015" cy="525" r="3.2" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="1055" cy="495" r="3.2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="1090" cy="520" r="3.4" fill="#38bdf8" filter="url(#starGlow)"/>
    <circle cx="910" cy="575" r="3.2" fill="#e0f2fe" filter="url(#starGlow)"/>
    <circle cx="955" cy="565" r="3" fill="#bae6fd"/>
    <circle cx="990" cy="595" r="3.2" fill="#38bdf8" filter="url(#starGlow)"/>
    <circle cx="1040" cy="580" r="3" fill="#ffffff"/>
    <circle cx="1080" cy="610" r="3.2" fill="#bae6fd" filter="url(#starGlow)"/>
    <circle cx="880" cy="620" r="2.8" fill="#bae6fd"/>
    <circle cx="920" cy="640" r="3" fill="#e0f2fe"/>
    <circle cx="965" cy="630" r="2.8" fill="#bae6fd"/>
    <circle cx="1005" cy="650" r="3.2" fill="#38bdf8" filter="url(#starGlow)"/>
  </g>

  <!-- ==================== CENTER: Hello World, I'm Swashua! ==================== -->
  <g transform="translate(600, 340)">
    <!-- Polaris Compass Star -->
    <path d="M 0 -85 L 6 -52 L 32 -45 L 6 -38 L 0 -5 L -6 -38 L -32 -45 L -6 -52 Z" fill="#ffffff" filter="url(#superGlow)"/>
    <circle cx="0" cy="-45" r="3" fill="#38bdf8"/>

    <text x="0" y="25" text-anchor="middle" class="title-main" filter="url(#starGlow)">
      Hello World, I'm Swashua!
    </text>
  </g>
</svg>
